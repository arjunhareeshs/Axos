[project]
name = "axos"
version = "0.1.0"
description = "CODING AGENT"
readme = "README.md"
authors = [
    { name = "arjunhareeshs", email = "arjunhareeshsenthil@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "prompt-toolkit>=3.0.53",
    "pyyaml>=6.0.3",
    "rich>=13.0.0",
]

[project.scripts]
axos = "Axoscode.agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "Axoscode"
